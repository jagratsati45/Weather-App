  <line x1="245" y1="155" x2="225" y2="155" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
  <line x1="435" y1="155" x2="455" y2="155" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
  <line x1="273" y1="88" x2="259" y2="74" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
  <line x1="407" y1="222" x2="421" y2="236" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
  <line x1="407" y1="88" x2="421" y2="74" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
  <line x1="273" y1="222" x2="259" y2="236" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
