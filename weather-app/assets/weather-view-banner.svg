<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bannerBg" cx="15%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1E5FA8"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </radialGradient>
    <radialGradient id="bannerSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A435"/>
    </radialGradient>
    <radialGradient id="bannerSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" rx="24" fill="url(#bannerBg)"/>
  <!-- Stars -->
  <circle cx="320" cy="40" r="2" fill="white" opacity="0.35"/>
  <circle cx="450" cy="25" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="700" cy="35" r="2" fill="white" opacity="0.3"/>
  <circle cx="950" cy="50" r="1.5" fill="white" opacity="0.2"/>
  <circle cx="1100" cy="30" r="2" fill="white" opacity="0.3"/>
  <circle cx="1050" cy="80" r="1.5" fill="white" opacity="0.2"/>
  <!-- Sun glow -->
  <circle cx="165" cy="175" r="100" fill="url(#bannerSunGlow)"/>
  <!-- Sun -->
  <circle cx="165" cy="175" r="65" fill="url(#bannerSun)"/>
  <!-- Sun rays -->
  <line x1="165" y1="95" x2="165" y2="78" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="165" y1="255" x2="165" y2="272" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="85" y1="175" x2="68" y2="175" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="245" y1="175" x2="262" y2="175" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  <line x1="108" y1="118" x2="96" y2="106" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
  <line x1="222" y1="232" x2="234" y2="244" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
  <line x1="222" y1="118" x2="234" y2="106" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
  <line x1="108" y1="232" x2="96" y2="244" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
  <!-- Cloud -->
  <ellipse cx="175" cy="265" rx="90" ry="45" fill="white" opacity="0.93"/>
  <ellipse cx="120" cy="280" rx="68" ry="38" fill="white" opacity="0.9"/>
  <ellipse cx="238" cy="282" rx="72" ry="35" fill="#e8f4ff" opacity="0.88"/>
  <ellipse cx="175" cy="260" rx="55" ry="32" fill="white" opacity="0.55"/>
  <!-- Rain drops -->
  <line x1="108" y1="310" x2="98" y2="352" stroke="#7EC8E3" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="316" x2="130" y2="358" stroke="#7EC8E3" stroke-width="6" stroke-linecap="round"/>
  <line x1="172" y1="316" x2="162" y2="358" stroke="#A8D8EA" stroke-width="6" stroke-linecap="round"/>
  <line x1="204" y1="313" x2="194" y2="355" stroke="#7EC8E3" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="310" x2="226" y2="350" stroke="#7EC8E3" stroke-width="6" stroke-linecap="round"/>
  <!-- App Name -->
  <text x="340" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="110" font-weight="800" fill="white" opacity="0.97" letter-spacing="-3">Weather</text>
  <text x="340" y="308" font-family="system-ui,-apple-system,sans-serif" font-size="110" font-weight="200" fill="#7EC8E3" letter-spacing="-1">View</text>
  <!-- Tagline -->
  <text x="344" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="white" opacity="0.4" letter-spacing="5">YOUR SKY. YOUR WAY.</text>
  <!-- Decorative vertical line -->
  <line x1="318" y1="130" x2="318" y2="330" stroke="white" stroke-width="1" opacity="0.12"/>
</svg>
